     -  name: Build
        working-directory: wallfix_1/wallfix
        run: gradle build --stacktrace

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '2.14.1'

      - name: Build
        run: gradle build --stacktrace

        - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: WallFix-jar
          path: wallfix_1/wallfix/build/libs/*.jar
