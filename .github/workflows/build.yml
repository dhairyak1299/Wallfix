name: Build WallFix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '2.14.1'

      - name: Build (retries on flaky Forge Maven downloads)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 4
          retry_wait_seconds: 20
          command: |
            cd wallfix_1/wallfix
            gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: WallFix-jar
          path: wallfix_1/wallfix/build/libs/*.jar
